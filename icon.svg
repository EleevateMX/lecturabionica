<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A394FF"/>
      <stop offset="100%" stop-color="#5B4ECC"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#shine)"/>

  <!-- Brain lobes (top) -->
  <circle cx="152" cy="178" r="82" fill="rgba(255,255,255,0.93)"/>
  <circle cx="256" cy="148" r="98" fill="rgba(255,255,255,0.93)"/>
  <circle cx="360" cy="178" r="82" fill="rgba(255,255,255,0.93)"/>

  <!-- Lower face area -->
  <ellipse cx="256" cy="326" rx="142" ry="120" fill="rgba(255,255,255,0.93)"/>

  <!-- Brain center sulcus -->
  <line x1="256" y1="122" x2="256" y2="224" stroke="#8B7CF8" stroke-width="7" stroke-linecap="round" opacity="0.3"/>

  <!-- Hemisphere folds -->
  <path d="M158 200 Q192 182 226 200" stroke="#8B7CF8" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.25"/>
  <path d="M286 200 Q320 182 354 200" stroke="#8B7CF8" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.25"/>

  <!-- Eyes (white sclera) -->
  <ellipse cx="202" cy="318" rx="42" ry="48" fill="white"/>
  <ellipse cx="310" cy="318" rx="42" ry="48" fill="white"/>

  <!-- Iris -->
  <circle cx="202" cy="320" r="30" fill="#6B5CE7"/>
  <circle cx="310" cy="320" r="30" fill="#6B5CE7"/>

  <!-- Pupil -->
  <circle cx="202" cy="320" r="16" fill="#1E1148"/>
  <circle cx="310" cy="320" r="16" fill="#1E1148"/>

  <!-- Eye shine (main) -->
  <circle cx="216" cy="305" r="11" fill="rgba(255,255,255,0.92)"/>
  <circle cx="324" cy="305" r="11" fill="rgba(255,255,255,0.92)"/>

  <!-- Eye shine (small) -->
  <circle cx="207" cy="328" r="5" fill="rgba(255,255,255,0.38)"/>
  <circle cx="315" cy="328" r="5" fill="rgba(255,255,255,0.38)"/>

  <!-- Subtle smile -->
  <path d="M216 378 Q256 404 296 378" stroke="#9B8CFF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.45"/>
</svg>
