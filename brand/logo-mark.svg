<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="lm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <filter id="lm-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4A3B9C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="80" height="80" rx="20" ry="20" fill="url(#lm-grad)" filter="url(#lm-shadow)"/>

  <!-- Subtle top highlight gloss -->
  <rect x="0" y="0" width="80" height="38" rx="20" fill="white" opacity="0.07"/>

  <!-- "F" — bold 800 -->
  <text x="10" y="56"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="42"
        font-weight="800"
        fill="white">F</text>

  <!-- "R" — light 300 -->
  <text x="40" y="56"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="42"
        font-weight="300"
        fill="white"
        opacity="0.88">R</text>
</svg>
