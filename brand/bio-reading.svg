<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <radialGradient id="bior-headGrad" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#B8AEFF"/>
      <stop offset="55%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#7065E0"/>
    </radialGradient>
    <radialGradient id="bior-bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A899FF"/>
      <stop offset="100%" stop-color="#7065E0"/>
    </radialGradient>
    <linearGradient id="bior-bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="bior-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B5CE7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- === DROP SHADOW === -->
  <ellipse cx="100" cy="252" rx="42" ry="7" fill="#4A3B9C" opacity="0.22"/>

  <!-- === BODY === -->
  <ellipse cx="100" cy="210" rx="30" ry="22" fill="url(#bior-bodyGrad)" filter="url(#bior-shadow)"/>
  <ellipse cx="100" cy="190" rx="18" ry="10" fill="#8B7CF8"/>

  <!-- === OPEN BOOK (held in front, both hands) === -->
  <g transform="translate(100, 222)">
    <!-- Book left page -->
    <path d="M-34 -12 Q-34 -24 -18 -24 L0 -24 L0 18 L-18 18 Q-34 18 -34 8 Z" fill="url(#bior-bookGrad)" stroke="#E8B84B" stroke-width="1.5"/>
    <!-- Book right page -->
    <path d="M34 -12 Q34 -24 18 -24 L0 -24 L0 18 L18 18 Q34 18 34 8 Z" fill="#FFF5CC" stroke="#E8B84B" stroke-width="1.5"/>
    <!-- Book spine -->
    <line x1="0" y1="-24" x2="0" y2="18" stroke="#C8963A" stroke-width="2.5"/>
    <!-- Book binding -->
    <ellipse cx="0" cy="-24" rx="4" ry="3" fill="#C8963A"/>
    <!-- Text lines on left page (bionic reading style — bold first chars) -->
    <rect x="-30" y="-16" width="8" height="3" rx="1" fill="#7065E0" opacity="0.7"/>
    <rect x="-20" y="-16" width="16" height="3" rx="1" fill="#9B8CFF" opacity="0.4"/>
    <rect x="-30" y="-9" width="6" height="3" rx="1" fill="#7065E0" opacity="0.7"/>
    <rect x="-22" y="-9" width="18" height="3" rx="1" fill="#9B8CFF" opacity="0.4"/>
    <rect x="-30" y="-2" width="10" height="3" rx="1" fill="#7065E0" opacity="0.7"/>
    <rect x="-18" y="-2" width="14" height="3" rx="1" fill="#9B8CFF" opacity="0.4"/>
    <rect x="-30" y="5" width="7" height="3" rx="1" fill="#7065E0" opacity="0.7"/>
    <rect x="-21" y="5" width="17" height="3" rx="1" fill="#9B8CFF" opacity="0.4"/>
    <!-- Text lines on right page -->
    <rect x="3" y="-16" width="9" height="3" rx="1" fill="#7065E0" opacity="0.7"/>
    <rect x="14" y="-16" width="15" height="3" rx="1" fill="#9B8CFF" opacity="0.4"/>
    <rect x="3" y="-9" width="7" height="3" rx="1" fill="#7065E0" opacity="0.7"/>
    <rect x="12" y="-9" width="17" height="3" rx="1" fill="#9B8CFF" opacity="0.4"/>
    <rect x="3" y="-2" width="11" height="3" rx="1" fill="#7065E0" opacity="0.7"/>
    <rect x="16" y="-2" width="13" height="3" rx="1" fill="#9B8CFF" opacity="0.4"/>
    <rect x="3" y="5" width="8" height="3" rx="1" fill="#7065E0" opacity="0.7"/>
    <rect x="13" y="5" width="16" height="3" rx="1" fill="#9B8CFF" opacity="0.4"/>
  </g>

  <!-- === LEFT ARM (down, holding book) === -->
  <path d="M72 202 Q58 212 58 224 Q58 232 66 234" stroke="#7065E0" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- === RIGHT ARM (down, holding book) === -->
  <path d="M128 202 Q142 212 142 224 Q142 232 134 234" stroke="#7065E0" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- === HEAD === -->
  <g filter="url(#bior-shadow)">
    <circle cx="100" cy="115" r="52" fill="url(#bior-headGrad)"/>
    <!-- Brain lobe bumps -->
    <circle cx="78" cy="66" r="16" fill="url(#bior-headGrad)"/>
    <circle cx="100" cy="62" r="17" fill="url(#bior-headGrad)"/>
    <circle cx="122" cy="66" r="16" fill="url(#bior-headGrad)"/>
    <rect x="64" y="75" width="72" height="20" fill="url(#bior-headGrad)" rx="2"/>
  </g>

  <!-- Brain fold details -->
  <path d="M80 95 Q90 88 100 95 Q110 102 120 95" stroke="#7B6CD0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M75 110 Q82 104 90 110" stroke="#7B6CD0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M110 108 Q118 102 126 108" stroke="#7B6CD0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M88 66 Q95 60 102 66" stroke="#7B6CD0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- === EYES (looking down) === -->
  <!-- Left eye — looking slightly down -->
  <ellipse cx="85" cy="118" rx="10" ry="11" fill="white"/>
  <circle cx="85" cy="121" r="7" fill="#1E1148"/>
  <circle cx="88" cy="118" r="2.5" fill="white"/>
  <!-- Eyelid (slightly lowered) -->
  <path d="M75 116 Q85 112 95 116" stroke="#9B8CFF" stroke-width="2.5" fill="none"/>

  <!-- Right eye — looking slightly down -->
  <ellipse cx="115" cy="118" rx="10" ry="11" fill="white"/>
  <circle cx="115" cy="121" r="7" fill="#1E1148"/>
  <circle cx="118" cy="118" r="2.5" fill="white"/>
  <!-- Eyelid -->
  <path d="M105 116 Q115 112 125 116" stroke="#9B8CFF" stroke-width="2.5" fill="none"/>

  <!-- === BLUSH === -->
  <ellipse cx="73" cy="130" rx="10" ry="6" fill="#F857A6" opacity="0.28"/>
  <ellipse cx="127" cy="130" rx="10" ry="6" fill="#F857A6" opacity="0.28"/>

  <!-- === CALM SMILE === -->
  <path d="M90 138 Q100 146 110 138" stroke="#1E1148" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- === THOUGHT BUBBLE === -->
  <g opacity="0.9">
    <!-- Small circles leading to bubble -->
    <circle cx="140" cy="100" r="3" fill="white" opacity="0.7"/>
    <circle cx="148" cy="92" r="4.5" fill="white" opacity="0.8"/>
    <circle cx="158" cy="82" r="6" fill="white" opacity="0.9"/>
    <!-- Main thought bubble -->
    <rect x="162" y="58" width="32" height="22" rx="10" fill="white"/>
    <!-- Three dots inside bubble -->
    <circle cx="170" cy="69" r="2.5" fill="#8B7CF8"/>
    <circle cx="178" cy="69" r="2.5" fill="#8B7CF8"/>
    <circle cx="186" cy="69" r="2.5" fill="#8B7CF8"/>
  </g>
</svg>
