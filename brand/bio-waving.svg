<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <radialGradient id="biow-headGrad" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#B8AEFF"/>
      <stop offset="55%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#7065E0"/>
    </radialGradient>
    <radialGradient id="biow-bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A899FF"/>
      <stop offset="100%" stop-color="#7065E0"/>
    </radialGradient>
    <filter id="biow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B5CE7" flood-opacity="0.35"/>
    </filter>
    <filter id="biow-sparkleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- === SPEECH BUBBLE "¡Hola!" === -->
  <g>
    <!-- Bubble rect -->
    <rect x="4" y="80" width="56" height="28" rx="10" fill="white" filter="url(#biow-shadow)"/>
    <!-- Bubble tail pointing right toward head -->
    <polygon points="56,94 66,98 56,100" fill="white"/>
    <!-- Text -->
    <text x="32" y="99" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B5CE7">¡Hola!</text>
  </g>

  <!-- === DROP SHADOW === -->
  <ellipse cx="100" cy="252" rx="42" ry="7" fill="#4A3B9C" opacity="0.22"/>

  <!-- === BODY === -->
  <ellipse cx="100" cy="210" rx="30" ry="22" fill="url(#biow-bodyGrad)" filter="url(#biow-shadow)"/>
  <ellipse cx="100" cy="190" rx="18" ry="10" fill="#8B7CF8"/>

  <!-- === LEFT ARM (raised high, waving) === -->
  <g stroke="#7065E0" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M72 198 Q52 178 42 152 Q36 132 44 114 Q48 104 56 100"/>
  </g>
  <!-- Left hand -->
  <circle cx="57" cy="97" r="8" fill="#9B8CFF" stroke="#7065E0" stroke-width="2"/>
  <!-- Waving fingers spread out -->
  <path d="M50 90 Q46 82 50 76" stroke="#9B8CFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M57 87 Q55 78 59 73" stroke="#9B8CFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M64 89 Q65 81 68 77" stroke="#9B8CFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M69 95 Q73 88 75 84" stroke="#9B8CFF" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- === RIGHT ARM (relaxed, at side) === -->
  <g stroke="#7065E0" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M128 200 Q145 205 150 218"/>
  </g>
  <circle cx="151" cy="221" r="7" fill="#9B8CFF" stroke="#7065E0" stroke-width="2"/>

  <!-- === HEAD === -->
  <g filter="url(#biow-shadow)">
    <circle cx="100" cy="115" r="52" fill="url(#biow-headGrad)"/>
    <!-- Brain lobe bumps -->
    <circle cx="78" cy="66" r="16" fill="url(#biow-headGrad)"/>
    <circle cx="100" cy="62" r="17" fill="url(#biow-headGrad)"/>
    <circle cx="122" cy="66" r="16" fill="url(#biow-headGrad)"/>
    <rect x="64" y="75" width="72" height="20" fill="url(#biow-headGrad)" rx="2"/>
  </g>

  <!-- Brain fold details -->
  <path d="M80 95 Q90 88 100 95 Q110 102 120 95" stroke="#7B6CD0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M75 110 Q82 104 90 110" stroke="#7B6CD0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M110 108 Q118 102 126 108" stroke="#7B6CD0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M88 66 Q95 60 102 66" stroke="#7B6CD0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- === EYES (excited, wide open) === -->
  <!-- Left eye -->
  <ellipse cx="85" cy="114" rx="11" ry="13" fill="white"/>
  <circle cx="86" cy="115" r="8" fill="#1E1148"/>
  <circle cx="89.5" cy="111" r="3" fill="white"/>

  <!-- Right eye -->
  <ellipse cx="115" cy="114" rx="11" ry="13" fill="white"/>
  <circle cx="116" cy="115" r="8" fill="#1E1148"/>
  <circle cx="119.5" cy="111" r="3" fill="white"/>

  <!-- === BLUSH (stronger) === -->
  <ellipse cx="71" cy="128" rx="12" ry="7" fill="#F857A6" opacity="0.36"/>
  <ellipse cx="129" cy="128" rx="12" ry="7" fill="#F857A6" opacity="0.36"/>

  <!-- === BIG SMILE === -->
  <path d="M84 137 Q100 155 116 137" stroke="#1E1148" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Smile fill for open-mouth look -->
  <path d="M84 137 Q100 155 116 137 Q100 148 84 137" fill="#F857A6" opacity="0.2"/>

  <!-- === EXTRA SPARKLES === -->
  <g filter="url(#biow-sparkleGlow)" fill="#FFD166">
    <!-- Main sparkle top right of head -->
    <path d="M140 66 L142 73 L149 75 L142 77 L140 84 L138 77 L131 75 L138 73 Z"/>
    <!-- Sparkle upper left of head -->
    <path d="M58 72 L59.5 77 L65 78.5 L59.5 80 L58 85 L56.5 80 L51 78.5 L56.5 77 Z" opacity="0.8"/>
    <!-- Small sparkle far right -->
    <path d="M158 50 L159 54 L163 55 L159 56 L158 60 L157 56 L153 55 L157 54 Z" opacity="0.75"/>
    <!-- Tiny dots -->
    <circle cx="130" cy="56" r="2.2" opacity="0.7"/>
    <circle cx="70" cy="58" r="1.8" opacity="0.65"/>
    <circle cx="155" cy="82" r="2" opacity="0.7"/>
    <!-- Pink accent sparkle -->
    <path d="M168 68 L169 71 L172 72 L169 73 L168 76 L167 73 L164 72 L167 71 Z" fill="#F857A6" opacity="0.7"/>
  </g>
</svg>
