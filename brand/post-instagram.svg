<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="ig-bgGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#0D0D14"/>
      <stop offset="60%" stop-color="#11082A"/>
      <stop offset="100%" stop-color="#1A1028"/>
    </linearGradient>
    <!-- Purple glow radial -->
    <radialGradient id="ig-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4A3B9C" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#2D2270" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D0D14" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom pink glow -->
    <radialGradient id="ig-glowPink" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#F857A6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D0D14" stop-opacity="0"/>
    </radialGradient>
    <!-- Icon gradient -->
    <linearGradient id="ig-iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <!-- Bio head gradient -->
    <radialGradient id="ig-headGrad" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#C0B4FF"/>
      <stop offset="55%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#7065E0"/>
    </radialGradient>
    <radialGradient id="ig-bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A899FF"/>
      <stop offset="100%" stop-color="#7065E0"/>
    </radialGradient>
    <linearGradient id="ig-bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <!-- Accent line gradient -->
    <linearGradient id="ig-accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F857A6"/>
      <stop offset="50%" stop-color="#8B7CF8"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="ig-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6B5CE7" flood-opacity="0.6"/>
    </filter>
    <filter id="ig-glowFilter">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ig-sparkleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ig-headlineGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect width="1080" height="1080" fill="url(#ig-bgGrad)"/>
  <rect width="1080" height="1080" fill="url(#ig-glow)"/>
  <rect width="1080" height="1080" fill="url(#ig-glowPink)"/>

  <!-- Star field -->
  <circle cx="120" cy="80" r="2" fill="white" opacity="0.2"/>
  <circle cx="380" cy="45" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="700" cy="100" r="2" fill="white" opacity="0.18"/>
  <circle cx="960" cy="55" r="1.5" fill="white" opacity="0.22"/>
  <circle cx="1020" cy="200" r="1.5" fill="white" opacity="0.2"/>
  <circle cx="60" cy="350" r="1.5" fill="white" opacity="0.18"/>
  <circle cx="1060" cy="800" r="2" fill="white" opacity="0.2"/>
  <circle cx="50" cy="900" r="1.5" fill="white" opacity="0.22"/>

  <!-- ===================== TOP LOGO BAR ===================== -->
  <!-- Logo icon -->
  <rect x="60" y="56" width="70" height="70" rx="18" fill="url(#ig-iconGrad)"/>
  <rect x="60" y="56" width="70" height="32" rx="18" fill="white" opacity="0.07"/>
  <text x="76" y="108" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" fill="white">F</text>
  <text x="104" y="108" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="300" fill="white" opacity="0.88">R</text>

  <!-- Wordmark -->
  <text x="148" y="94" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="white">Focus</text>
  <text x="317" y="94" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="300" fill="rgba(255,255,255,0.65)">Read</text>

  <!-- Tag -->
  <rect x="148" y="105" width="180" height="20" rx="10" fill="rgba(139,124,248,0.15)" stroke="#8B7CF8" stroke-width="1"/>
  <text x="238" y="119" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#8B7CF8" letter-spacing="1.5">LECTURA BIÓNICA</text>

  <!-- ===================== ACCENT LINE ===================== -->
  <rect x="0" y="148" width="1080" height="3" fill="url(#ig-accentLine)" opacity="0.8"/>

  <!-- ===================== HEADLINE ===================== -->
  <text x="540" y="265"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="110"
        font-weight="800"
        fill="white"
        filter="url(#ig-headlineGlow)"
        letter-spacing="-2">¿Tienes TDAH?</text>

  <!-- Subtitle -->
  <text x="540" y="318"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="26"
        font-weight="400"
        fill="rgba(139,124,248,0.9)"
        letter-spacing="0.5">La lectura biónica puede ayudarte a concentrarte</text>

  <!-- ===================== BIONIC TEXT DEMO ===================== -->
  <!-- Demo card background -->
  <rect x="80" y="348" width="920" height="300" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(139,124,248,0.25)" stroke-width="1.5"/>
  <!-- Corner accent -->
  <rect x="80" y="348" width="4" height="300" rx="2" fill="url(#ig-accentLine)"/>

  <!-- Demo header -->
  <text x="540" y="392" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="rgba(139,124,248,0.7)" letter-spacing="2.5">— EJEMPLO DE TEXTO BIÓNICO —</text>

  <!-- Line 1 -->
  <text x="120" y="436" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" fill="white" letter-spacing="0.3">
    <tspan font-weight="700">La</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">lec</tspan><tspan font-weight="400">tura </tspan><tspan font-weight="700">bió</tspan><tspan font-weight="400">nica </tspan><tspan font-weight="700">ay</tspan><tspan font-weight="400">uda </tspan><tspan font-weight="700">a</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">man</tspan><tspan font-weight="400">tener</tspan>
  </text>
  <!-- Line 2 -->
  <text x="120" y="488" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" fill="white" letter-spacing="0.3">
    <tspan font-weight="700">el</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">fo</tspan><tspan font-weight="400">co </tspan><tspan font-weight="700">al</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">le</tspan><tspan font-weight="400">er, </tspan><tspan font-weight="700">re</tspan><tspan font-weight="400">du</tspan><tspan font-weight="700">cien</tspan><tspan font-weight="400">do</tspan>
  </text>
  <!-- Line 3 -->
  <text x="120" y="540" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" fill="rgba(255,255,255,0.85)" letter-spacing="0.3">
    <tspan font-weight="700">la</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">dis</tspan><tspan font-weight="400">trac</tspan><tspan font-weight="700">ción</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">y</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">me</tspan><tspan font-weight="400">jo</tspan><tspan font-weight="700">ran</tspan><tspan font-weight="400">do</tspan>
  </text>
  <!-- Line 4 -->
  <text x="120" y="592" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" fill="rgba(255,255,255,0.7)" letter-spacing="0.3">
    <tspan font-weight="700">la</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">com</tspan><tspan font-weight="400">pren</tspan><tspan font-weight="700">sión</tspan><tspan font-weight="400"> </tspan><tspan font-weight="700">lec</tspan><tspan font-weight="400">tora.</tspan>
  </text>

  <!-- Legend -->
  <rect x="120" y="620" width="20" height="5" rx="2.5" fill="white"/>
  <text x="148" y="630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">Negrita = ancla visual</text>
  <rect x="340" y="620" width="20" height="5" rx="2.5" fill="rgba(255,255,255,0.35)"/>
  <text x="368" y="630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">Regular = flujo natural</text>

  <!-- ===================== BIO MASCOT (bottom right) ===================== -->
  <g transform="translate(870, 920) scale(2.1)">
    <!-- Body -->
    <ellipse cx="0" cy="68" rx="30" ry="22" fill="url(#ig-bodyGrad)" filter="url(#ig-shadow)"/>
    <ellipse cx="0" cy="48" rx="18" ry="10" fill="#8B7CF8"/>

    <!-- Left arm (waving) -->
    <path d="M-28 58 Q-46 40 -52 14 Q-56 -2 -46 -12" stroke="#7065E0" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="-46" cy="-14" r="7" fill="#9B8CFF" stroke="#7065E0" stroke-width="2"/>
    <path d="M-50 -20 Q-52 -28 -48 -33" stroke="#9B8CFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M-44 -22 Q-44 -30 -39 -34" stroke="#9B8CFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M-39 -18 Q-37 -26 -34 -30" stroke="#9B8CFF" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Right arm -->
    <path d="M28 58 Q44 48 50 28 Q54 12 48 2" stroke="#7065E0" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- Book -->
    <g transform="translate(48, 2)">
      <path d="M-16 -10 Q-16 -18 -7 -18 L0 -18 L0 14 L-7 14 Q-16 14 -16 6 Z" fill="url(#ig-bookGrad)" stroke="#E8B84B" stroke-width="1"/>
      <path d="M16 -10 Q16 -18 7 -18 L0 -18 L0 14 L7 14 Q16 14 16 6 Z" fill="#FFF0B8" stroke="#E8B84B" stroke-width="1"/>
      <line x1="0" y1="-18" x2="0" y2="14" stroke="#C8963A" stroke-width="2"/>
    </g>

    <!-- HEAD -->
    <g filter="url(#ig-shadow)">
      <circle cx="0" cy="-30" r="52" fill="url(#ig-headGrad)"/>
      <circle cx="-22" cy="-79" r="16" fill="url(#ig-headGrad)"/>
      <circle cx="0" cy="-83" r="17" fill="url(#ig-headGrad)"/>
      <circle cx="22" cy="-79" r="16" fill="url(#ig-headGrad)"/>
      <rect x="-36" y="-70" width="72" height="20" fill="url(#ig-headGrad)" rx="2"/>
    </g>

    <!-- Brain folds -->
    <path d="M-20 -50 Q-10 -57 0 -50 Q10 -43 20 -50" stroke="#7B6CD0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M-25 -36 Q-18 -42 -10 -36" stroke="#7B6CD0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M10 -38 Q18 -44 26 -38" stroke="#7B6CD0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Eyes -->
    <ellipse cx="-15" cy="-29" rx="10" ry="12" fill="white"/>
    <circle cx="-14" cy="-28" r="7" fill="#1E1148"/>
    <circle cx="-11" cy="-32" r="2.5" fill="white"/>
    <ellipse cx="15" cy="-29" rx="10" ry="12" fill="white"/>
    <circle cx="16" cy="-28" r="7" fill="#1E1148"/>
    <circle cx="19" cy="-32" r="2.5" fill="white"/>

    <!-- Blush -->
    <ellipse cx="-27" cy="-18" rx="10" ry="6" fill="#F857A6" opacity="0.28"/>
    <ellipse cx="27" cy="-18" rx="10" ry="6" fill="#F857A6" opacity="0.28"/>

    <!-- Smile -->
    <path d="M-12 -10 Q0 2 12 -10" stroke="#1E1148" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Sparkles -->
    <g filter="url(#ig-sparkleGlow)" fill="#FFD166">
      <path d="M38 -78 L40 -72 L46 -70 L40 -68 L38 -62 L36 -68 L30 -70 L36 -72 Z"/>
      <path d="M52 -90 L53 -87 L56 -86 L53 -85 L52 -82 L51 -85 L48 -86 L51 -87 Z" opacity="0.8"/>
      <circle cx="26" cy="-88" r="2" opacity="0.7"/>
    </g>
  </g>

  <!-- ===================== BOTTOM CTA ===================== -->
  <!-- Separator -->
  <rect x="0" y="930" width="1080" height="2" fill="url(#ig-accentLine)" opacity="0.5"/>

  <!-- CTA text -->
  <text x="200" y="990"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="30"
        font-weight="400"
        fill="rgba(255,255,255,0.75)">Pruébalo gratis · </text>
  <text x="520" y="990"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="30"
        font-weight="700"
        fill="#8B7CF8">focusread.app</text>

  <!-- Decorative dots bottom -->
  <circle cx="60" cy="990" r="6" fill="#8B7CF8" opacity="0.4"/>
  <circle cx="82" cy="990" r="6" fill="#F857A6" opacity="0.4"/>
  <circle cx="104" cy="990" r="6" fill="#FFD166" opacity="0.4"/>

  <!-- Bottom tagline -->
  <text x="540" y="1040"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="18"
        font-weight="400"
        fill="rgba(136,136,168,0.6)"
        letter-spacing="1">Lectura biónica para mentes brillantes · Para TDAH y dificultades lectoras</text>
</svg>
