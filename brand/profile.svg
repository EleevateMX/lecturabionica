<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="prof-bgGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4A3B9C"/>
      <stop offset="50%" stop-color="#2D2270"/>
      <stop offset="100%" stop-color="#0D0D14"/>
    </radialGradient>
    <!-- Head gradient -->
    <radialGradient id="prof-headGrad" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#C0B4FF"/>
      <stop offset="55%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#7065E0"/>
    </radialGradient>
    <!-- Body gradient -->
    <radialGradient id="prof-bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A899FF"/>
      <stop offset="100%" stop-color="#7065E0"/>
    </radialGradient>
    <!-- Book gradient -->
    <linearGradient id="prof-bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <!-- Clip circle for profile -->
    <clipPath id="prof-clip">
      <circle cx="400" cy="400" r="400"/>
    </clipPath>
    <!-- Glow filter -->
    <filter id="prof-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="prof-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#6B5CE7" flood-opacity="0.5"/>
    </filter>
    <filter id="prof-sparkleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#prof-clip)">
    <!-- === BACKGROUND === -->
    <rect width="800" height="800" fill="url(#prof-bgGrad)"/>

    <!-- Decorative purple glow blob -->
    <circle cx="320" cy="280" r="220" fill="#7065E0" opacity="0.12" filter="url(#prof-glow)"/>
    <circle cx="480" cy="320" r="160" fill="#F857A6" opacity="0.06" filter="url(#prof-glow)"/>

    <!-- Subtle star field dots -->
    <circle cx="100" cy="150" r="1.5" fill="white" opacity="0.3"/>
    <circle cx="680" cy="120" r="2" fill="white" opacity="0.25"/>
    <circle cx="720" cy="400" r="1.5" fill="white" opacity="0.2"/>
    <circle cx="50" cy="500" r="2" fill="white" opacity="0.3"/>
    <circle cx="750" cy="600" r="1.5" fill="white" opacity="0.2"/>
    <circle cx="200" cy="700" r="1.5" fill="white" opacity="0.25"/>

    <!-- === BIO MASCOT (bust — head + upper body + arms) === -->
    <!-- Scale and position: center at ~400,350, ~2.2x scale -->
    <g transform="translate(400, 380) scale(2.6)">

      <!-- Body -->
      <ellipse cx="0" cy="62" rx="30" ry="22" fill="url(#prof-bodyGrad)" filter="url(#prof-shadow)"/>
      <ellipse cx="0" cy="42" rx="18" ry="10" fill="#8B7CF8"/>

      <!-- Left arm (waving) -->
      <path d="M-28 52 Q-44 36 -50 14 Q-54 2 -46 -6" stroke="#7065E0" stroke-width="9" stroke-linecap="round" fill="none"/>
      <circle cx="-46" cy="-8" r="7" fill="#9B8CFF" stroke="#7065E0" stroke-width="2"/>
      <path d="M-50 -14 Q-52 -21 -48 -26" stroke="#9B8CFF" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M-44 -16 Q-44 -23 -40 -27" stroke="#9B8CFF" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M-39 -13 Q-37 -20 -34 -23" stroke="#9B8CFF" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- Right arm (holding book) -->
      <path d="M28 52 Q44 42 50 26 Q54 12 48 2" stroke="#7065E0" stroke-width="9" stroke-linecap="round" fill="none"/>

      <!-- Book -->
      <g transform="translate(48, 2)">
        <path d="M-16 -10 Q-16 -18 -7 -18 L0 -18 L0 14 L-7 14 Q-16 14 -16 6 Z" fill="url(#prof-bookGrad)" stroke="#E8B84B" stroke-width="1"/>
        <path d="M16 -10 Q16 -18 7 -18 L0 -18 L0 14 L7 14 Q16 14 16 6 Z" fill="#FFF0B8" stroke="#E8B84B" stroke-width="1"/>
        <line x1="0" y1="-18" x2="0" y2="14" stroke="#C8963A" stroke-width="2"/>
        <line x1="-12" y1="-6" x2="-2" y2="-6" stroke="#C8963A" stroke-width="1" opacity="0.6"/>
        <line x1="-12" y1="0" x2="-2" y2="0" stroke="#C8963A" stroke-width="1" opacity="0.6"/>
        <line x1="-12" y1="6" x2="-2" y2="6" stroke="#C8963A" stroke-width="1" opacity="0.6"/>
        <line x1="2" y1="-6" x2="12" y2="-6" stroke="#C8963A" stroke-width="1" opacity="0.6"/>
        <line x1="2" y1="0" x2="12" y2="0" stroke="#C8963A" stroke-width="1" opacity="0.6"/>
        <line x1="2" y1="6" x2="12" y2="6" stroke="#C8963A" stroke-width="1" opacity="0.6"/>
      </g>

      <!-- HEAD -->
      <g filter="url(#prof-shadow)">
        <circle cx="0" cy="-35" r="52" fill="url(#prof-headGrad)"/>
        <circle cx="-22" cy="-84" r="16" fill="url(#prof-headGrad)"/>
        <circle cx="0" cy="-88" r="17" fill="url(#prof-headGrad)"/>
        <circle cx="22" cy="-84" r="16" fill="url(#prof-headGrad)"/>
        <rect x="-36" y="-75" width="72" height="20" fill="url(#prof-headGrad)" rx="2"/>
      </g>

      <!-- Brain fold details -->
      <path d="M-20 -55 Q-10 -62 0 -55 Q10 -48 20 -55" stroke="#7B6CD0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M-25 -40 Q-18 -46 -10 -40" stroke="#7B6CD0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M10 -42 Q18 -48 26 -42" stroke="#7B6CD0" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M-12 -84 Q-5 -90 2 -84" stroke="#7B6CD0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

      <!-- Eyes -->
      <ellipse cx="-15" cy="-34" rx="10" ry="12" fill="white"/>
      <circle cx="-14" cy="-33" r="7" fill="#1E1148"/>
      <circle cx="-11" cy="-37" r="2.5" fill="white"/>

      <ellipse cx="15" cy="-34" rx="10" ry="12" fill="white"/>
      <circle cx="16" cy="-33" r="7" fill="#1E1148"/>
      <circle cx="19" cy="-37" r="2.5" fill="white"/>

      <!-- Blush -->
      <ellipse cx="-27" cy="-22" rx="10" ry="6" fill="#F857A6" opacity="0.28"/>
      <ellipse cx="27" cy="-22" rx="10" ry="6" fill="#F857A6" opacity="0.28"/>

      <!-- Smile -->
      <path d="M-12 -14 Q0 -2 12 -14" stroke="#1E1148" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Sparkles -->
      <g filter="url(#prof-sparkleGlow)" fill="#FFD166">
        <path d="M38 -82 L40 -76 L46 -74 L40 -72 L38 -66 L36 -72 L30 -74 L36 -76 Z"/>
        <path d="M52 -94 L53 -91 L56 -90 L53 -89 L52 -86 L51 -89 L48 -90 L51 -91 Z" opacity="0.8"/>
        <circle cx="26" cy="-92" r="2" opacity="0.7"/>
      </g>
    </g>

    <!-- === BOTTOM WORDMARK === -->
    <!-- Subtle separator line -->
    <line x1="200" y1="698" x2="600" y2="698" stroke="rgba(139,124,248,0.3)" stroke-width="1"/>

    <text x="400" y="740"
          text-anchor="middle"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="36"
          letter-spacing="2"
          fill="white">
      <tspan font-weight="700">Focus</tspan><tspan font-weight="300" fill="rgba(255,255,255,0.65)">Read</tspan>
    </text>

    <text x="400" y="770"
          text-anchor="middle"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="14"
          font-weight="400"
          letter-spacing="3"
          fill="rgba(139,124,248,0.7)">LECTURA BIÓNICA</text>
  </g>
</svg>
